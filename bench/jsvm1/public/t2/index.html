<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>潮汐票务 - 登录</title></head>
<body>
<form id="f"><input id="u" placeholder="手机号/邮箱"><input id="p" type="password" placeholder="密码"><button>登录</button></form>
<pre id="out"></pre>
<script src="app.js"></script>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  TW.login(document.getElementById('u').value, document.getElementById('p').value)
    .then(function (r) { return r.json(); })
    .then(function (j) { document.getElementById('out').textContent = JSON.stringify(j, null, 2); });
});
</script>
</body>
</html>
