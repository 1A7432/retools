<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>潮汐票务 - 结算</title></head>
<body>
<form id="f"><input id="order" placeholder="订单号"><select id="pay"><option>alipay</option><option>wechat</option></select><button>去支付</button></form>
<pre id="out"></pre>
<script src="app.js"></script>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  TW.request('/api/v3/checkout', { order: document.getElementById('order').value, pay: document.getElementById('pay').value })
    .then(function (r) { return r.json(); })
    .then(function (j) { document.getElementById('out').textContent = JSON.stringify(j, null, 2); });
});
</script>
</body>
</html>
