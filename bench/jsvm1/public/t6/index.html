<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>潮汐票务 - 支付</title></head>
<body>
<form id="f"><input id="order" placeholder="订单号"><input id="amount" placeholder="金额"><button>确认支付</button></form>
<pre id="out"></pre>
<script src="app.js"></script>
<script>
document.getElementById('f').addEventListener('submit', function (e) {
  e.preventDefault();
  TW.request('/api/v3/pay', { order: document.getElementById('order').value, amount: document.getElementById('amount').value })
    .then(function (r) { return r.json(); })
    .then(function (j) { document.getElementById('out').textContent = JSON.stringify(j, null, 2); });
});
</script>
</body>
</html>
