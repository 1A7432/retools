[project]
name = "remu"
version = "0.1.0"
requires-python = ">=3.12"
description = "Function-level emulator (Unicorn) for memory images exported from IDA"
dependencies = [
    "capstone>=5.0,<6",
    "unicorn>=2.1.4,<2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
